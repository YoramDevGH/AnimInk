name: Bug report
description: Report a reproducible problem in AnimInk
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: AnimInk version
      placeholder: "0.5.3"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and firmware
      placeholder: "Supernote Nomad, firmware version …"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Do not attach projects containing personal information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
